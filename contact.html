<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | GlamMaker</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body class="login-page">

    <!-- HEADER -->

    <header class="login-header">

        <a href="index.html" class="login-logo">
            GlamMaker
        </a>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </header>


    <!-- CONTACT -->

    <main class="login-container">

        <!-- LEFT SIDE -->

        <div class="login-box">

            <p class="login-eyebrow">
                GET IN TOUCH
            </p>

            <h1>
                Contact<br>
                <em>GlamMaker.</em>
            </h1>

            <p class="login-description">
                Have a question, suggestion, or feedback?
                We'd love to hear from you.
            </p>

            <p class="login-description">
                Email: glammaker@gmail.com
            </p>

            <p class="login-description">
                Phone: +91 XXXXX XXXXX
            </p>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-box">

            <form>

                <div class="input-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your message"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    SEND MESSAGE
                    <span>→</span>
                </button>

            </form>

        </div>

    </main>

</body>

</html>
